# Inclui+ Vision: de onde vêm as imagens e como as classes de cada fonte viram as nossas.
#
# Cada fonte é uma pasta no formato YOLO (export "YOLOv8" ou "YOLOv11" do Roboflow, ou o do CVAT)
# com o data.yaml dela dentro. Os caminhos são relativos a este arquivo.
# Depois de editar, rode a partir da raiz do repositório:
#   python src/preparar_dataset.py --config dataset/fontes.yaml --saida dataset --limpar

# Classes finais, na ordem dos IDs. É o escopo reduzido da proposta.
# As outras quatro (elevador, barra_apoio, vaga_pcd, simbolo_acessibilidade) entram aqui
# quando houver fontes com imagens delas.

classes:
  - rampa
  - escada
  - corrimao
  - piso_tatil

divisao:
  treino: 0.7
  validacao: 0.2
  teste: 0.1
semente: 42

fontes:
  - nome: stairs-handrail
    pasta: brutos/stairs-handrail
    origem: publico
    mapa:
      upstairs: escada
      downstairs: escada
      handrail: corrimao

  - nome: stairs-barrierfree
    pasta: brutos/stairs-barrierfree
    origem: publico
    mapa:
      stairs: escada

  - nome: detector-rampas
    pasta: brutos/detector-rampas
    origem: publico
    mapa:
      "rampa": rampa
      "ramp - v1 2026-05-30 3-13pm": rampa
      "detector-rampas - v1 2026-05-27 10-04pm": rampa

  - nome: braille-block
    pasta: brutos/braille-block
    origem: publico
    mapa:
      braille_block: piso_tatil
      # braille_block_unusable (6 caixas) e no_braille_block ficam de fora, como no treino
      # do modelo entregue. Mudar este mapa refaz o sorteio de treino, validação e teste.
